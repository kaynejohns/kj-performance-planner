[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  [functions."api"]
    timeout = 26

# API routes → serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# React planner SPA — serve planner.html for all /planner/* routes
[[redirects]]
  from = "/planner/*"
  to = "/planner.html"
  status = 200

[[redirects]]
  from = "/planner"
  to = "/planner.html"
  status = 200

# Root → landing page (already public/index.html, served by default)
